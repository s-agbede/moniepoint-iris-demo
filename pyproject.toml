[project]
name = "moniepoint-iris-demo"
version = "0.1.0"
description = "Inspectable SAYT support simulator for an agent-memory walkthrough"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-redis>=0.4,<1",
    "openai>=2,<3",
    "pydantic>=2.10,<3",
    "redis>=5,<7",
    "redis-agent-memory>=0.4.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "httpx2>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moniepoint_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
